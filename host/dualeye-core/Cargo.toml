[package]
name = "dualeye-core"
version = "1.0.0"
edition = "2024"
description = "Reads CPU/GPU/fan sensors and streams them to the ESP32-S3 DualEye board"
authors = ["Ettore Caputo <ettore.caputo27@gmail.com>"]
license = "MIT"
repository = "https://github.com/EttoreCaputo/esp32s3-dualeye"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", optional = true }
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "jpeg", "webp", "bmp"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serialport = { version = "4.10.1", default-features = false }
sha2 = { version = "0.11.0", optional = true }
starship-battery = "0.12.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "component", "network", "disk"] }
tar = { version = "0.4.46", optional = true }
tokio = { version = "1.53.1", features = ["rt", "time"], optional = true }
ureq = "3.4.2"

# NVML ships with the NVIDIA driver on Linux and Windows; it is loaded at runtime,
# so machines without an NVIDIA GPU just skip it.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nvml-wrapper = "0.13.0"

# The system's media session (the music face) on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Media_Control", "Storage_Streams"] }

# The mouse pointer (the eyes face) on X11, loaded at run time.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

# SMC and IOAccelerator for the Mac's GPU; already in the tree through serialport.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
io-kit-sys = "0.4.1"
mach2 = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Download a private Python and install esptool into a virtualenv on first use,
# so the desktop app needs nothing preinstalled. Off for the CLI.
provision = ["download", "dep:flate2", "dep:tar"]
# HTTPS downloads checked against a SHA-256 (`download`, `models::download`).
download = ["dep:sha2"]
# The MCP server (`mcp::serve_stdio`), for `dualeye mcp` and `dualeye-app --mcp`.
mcp = ["dep:rmcp", "dep:tokio"]

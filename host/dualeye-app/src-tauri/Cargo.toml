[package]
name = "dualeye-app"
version = "0.1.0"
edition = "2024"
description = "Desktop app for the ESP32-S3 DualEye PC monitor"
authors = ["Ettore Caputo <ettore.caputo27@gmail.com>"]
license = "MIT"
repository = "https://github.com/EttoreCaputo/esp32s3-dualeye"

[lib]
name = "dualeye_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dualeye-app"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
dualeye-core = { version = "0.1.0", path = "../../dualeye-core", features = ["provision", "mcp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.5"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
